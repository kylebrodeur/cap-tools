[project]
name = "cap-tools"
version = "0.1.0"
description = "Unified CLI for Cap screen recording automation and guide generation"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "playwright>=1.40",
]

[project.scripts]
capt = "capt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["capt*"]
